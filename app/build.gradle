plugins {
    id "com.android.application"
}

android {
    namespace "com.example.phonefilemanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.phonefilemanager"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name
        def variantCap = variantName.substring(0, 1).toUpperCase() + variantName.substring(1)
        def apkFileName = "手机文件管理-${variantName}.apk"
        def copyTask = tasks.register("copy${variantCap}ApkToRoot") {
            doNotTrackState("Copying APK into the project root is an external side effect.")
            dependsOn("package${variantCap}")
            doLast {
                copy {
                    from(layout.buildDirectory.dir("outputs/apk/${variantName}"))
                    include("*.apk")
                    into(rootProject.layout.projectDirectory)
                    rename { apkFileName }
                }
            }
        }

        tasks.named("assemble${variantCap}").configure {
            finalizedBy(copyTask)
        }
    }
}
